<!-- ========================================
     SCHEDULING SECTION FOR DASHBOARD
     Add this section to your dashboard_new.html
     ======================================== -->

<section id="scheduling" class="page-section" style="display: none;">
    <div class="section-header">
        <h2>📅 Specialist Scheduling</h2>
        <p>Schedule appointments with gastroenterologists and specialists</p>
    </div>

    <!-- Tabs for different views -->
    <div class="scheduling-tabs">
        <button class="tab-btn active" onclick="switchSchedulingTab('request')">
            📝 Request Appointment
        </button>
        <button class="tab-btn" onclick="switchSchedulingTab('pending')">
            ⏳ Pending (<span id="pendingCount">0</span>)
        </button>
        <button class="tab-btn" onclick="switchSchedulingTab('confirmed')">
            ✅ Confirmed (<span id="confirmedCount">0</span>)
        </button>
        <button class="tab-btn" onclick="switchSchedulingTab('specialists')">
            👨‍⚕️ Specialists
        </button>
    </div>

    <!-- Tab Content -->
    <div class="scheduling-content">
        
        <!-- Request Appointment Tab -->
        <div id="request-tab" class="tab-content active">
            <div class="card">
                <h3>Request New Appointment</h3>
                <form id="appointmentRequestForm" onsubmit="submitAppointmentRequest(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Select Specialist *</label>
                            <select id="specialistSelect" required>
                                <option value="">Loading specialists...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Related Case (Optional)</label>
                            <select id="caseSelect">
                                <option value="">Select a case...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Preferred Date & Time *</label>
                            <input type="datetime-local" id="preferredDate" required>
                        </div>

                        <div class="form-group">
                            <label>Urgency Level *</label>
                            <select id="urgencyLevel" required>
                                <option value="normal">Normal</option>
                                <option value="urgent">Urgent</option>
                                <option value="emergency">Emergency</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Reason for Consultation *</label>
                        <textarea id="appointmentReason" rows="4" placeholder="Describe the reason for this appointment..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Additional Notes</label>
                        <textarea id="appointmentNotes" rows="3" placeholder="Any special requirements or additional information..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        📅 Request Appointment
                    </button>
                </form>
            </div>
        </div>

        <!-- Pending Appointments Tab -->
        <div id="pending-tab" class="tab-content">
            <div id="pendingAppointments" class="appointments-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading pending appointments...</p>
                </div>
            </div>
        </div>

        <!-- Confirmed Appointments Tab -->
        <div id="confirmed-tab" class="tab-content">
            <div id="confirmedAppointments" class="appointments-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading confirmed appointments...</p>
                </div>
            </div>
        </div>

        <!-- Specialists List Tab -->
        <div id="specialists-tab" class="tab-content">
            <div id="specialistsList" class="specialists-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading specialists...</p>
                </div>
            </div>
        </div>
    </div>
</section>
