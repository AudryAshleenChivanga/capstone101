<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <link rel="stylesheet" href="login_styles.css">
    <link rel="stylesheet" href="mobile-responsive.css">
</head>
<body>
    <!-- 3D Background Model (Full Screen) -->

            </div>

    <!-- Gradient Overlay -->
    <div class="gradient-overlay"></div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
                            </svg>
        <span>Back to Home</span>
    </a>

    <!-- Main Container -->
    <div class="auth-container">
        <!-- Login Card -->
        <div class="auth-card" id="loginCard">
            <div class="card-header">
                <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="6"/>
                    <circle cx="12" cy="12" r="2"/>
                </svg>
            </div>
                <h1 class="card-title">Welcome Back</h1>
                <p class="card-subtitle">Sign in to access your clinical dashboard</p>
                </div>

                <div id="messageArea" class="message-area"></div>

            <form id="loginForm" class="auth-form">
                    <div class="form-group">
                    <label for="username">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>Username</span>
                    </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            required 
                            placeholder="Enter your username"
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                    <label for="password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span>Password</span>
                    </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" id="loginBtn" class="btn-primary">
                        <span class="btn-text">Sign In to Dashboard</span>
                        <div class="spinner"></div>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                    </button>
                </form>

                <div class="divider">
                <span>New to the platform?</span>
                </div>

                <button type="button" id="showRegisterBtn" class="btn-secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                <span>Create Administrator Account</span>
                </button>

            <div class="help-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span>First time? Register as the initial system administrator</span>
                </div>
            </div>

        <!-- Registration Card (Hidden Initially) -->
        <div class="auth-card" id="registerCard" style="display: none;">
            <div class="card-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
        </div>
                <h1 class="card-title">Create Account</h1>
                <p class="card-subtitle">Register as the system administrator</p>
            </div>

            <div id="registerMessageArea" class="message-area"></div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regUsername">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>Username</span>
                    </label>
                    <input 
                        type="text" 
                        id="regUsername" 
                        name="username" 
                        required 
                        placeholder="Choose a username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="regEmail">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <span>Email</span>
                    </label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        name="email" 
                        required 
                        placeholder="your@email.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="regPassword">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <span>Password</span>
                    </label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        name="password" 
                        required 
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" id="registerBtn" class="btn-primary">
                    <span class="btn-text">Create Account</span>
                    <div class="spinner"></div>
                    <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>

                <button type="button" id="showLoginBtn" class="btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    <span>Back to Sign In</span>
                </button>
            </form>
        </div>
    </div>

    <script src="login_auth.js"></script>
    <script src="mobile-navigation.js"></script>
</body>
</html>
