<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Specialist - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .required {
            color: #ef4444;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }
        
        .message.show {
            display: block;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Specialist User</h1>
        <p class="subtitle">Admin Only - Add a new gastroenterology specialist</p>
        
        <form id="createSpecialistForm">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" id="username" required placeholder="e.g. dr_smith">
            </div>
            
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required placeholder="dr.smith@hospital.com">
            </div>
            
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" required placeholder="Dr. John Smith">
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" required placeholder="Minimum 8 characters" minlength="8">
            </div>
            
            <div class="form-group">
                <label>Specialty <span class="required">*</span></label>
                <select id="specialty" required>
                    <option value="">Select specialty...</option>
                    <option value="Gastroenterology">Gastroenterology</option>
                    <option value="General Surgery">General Surgery</option>
                    <option value="Internal Medicine">Internal Medicine</option>
                    <option value="Hepatology">Hepatology</option>
                    <option value="Oncology">Oncology</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Institution</label>
                <input type="text" id="institution" placeholder="e.g. City General Hospital">
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                Create Specialist
            </button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="back-link">
            <a href="dashboard_new.html">← Back to Dashboard</a>
        </div>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000';
        
        document.getElementById('createSpecialistForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            
            // Get form data
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                full_name: document.getElementById('fullName').value,
                password: document.getElementById('password').value,
                role: 'specialist',
                specialty: document.getElementById('specialty').value,
                institution: document.getElementById('institution').value || 'Medical Center'
            };
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';
            
            try {
                // Get token from localStorage
                const token = localStorage.getItem('access_token');
                
                if (!token) {
                    throw new Error('You must be logged in as admin. Please login first.');
                }
                
                const response = await fetch(`${API_BASE}/admin/users`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.detail || 'Failed to create specialist');
                }
                
                // Success
                messageEl.className = 'message success show';
                messageEl.textContent = `✓ Specialist created successfully! Username: ${data.username} | Password: ${data.password}`;
                
                // Reset form
                document.getElementById('createSpecialistForm').reset();
                
                // Auto-hide message after 5 seconds
                setTimeout(() => {
                    messageEl.className = 'message';
                }, 5000);
                
            } catch (error) {
                console.error('Error:', error);
                messageEl.className = 'message error show';
                messageEl.textContent = `✗ Error: ${error.message}`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Specialist';
            }
        });
    </script>
</body>
</html>
