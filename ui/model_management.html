<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Management - H. pylori CDSS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .model-management-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .page-header h1 {
            color: var(--primary-color);
            font-size: 2em;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .model-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .model-title {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .model-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-active {
            background: #2ecc71;
            color: white;
        }

        .status-training {
            background: #f39c12;
            color: white;
        }

        .status-failed {
            background: #e74c3c;
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .metric-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
        }

        .metric-value.good {
            color: #2ecc71;
        }

        .metric-value.warning {
            color: #f39c12;
        }

        .metric-value.danger {
            color: #e74c3c;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .section-title {
            font-size: 1.8em;
            color: var(--primary-color);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        .predictions-table {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
        }

        .predictions-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .predictions-table th {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: left;
            font-weight: bold;
            color: var(--primary-color);
        }

        .predictions-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .predictions-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: white;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.15);
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }

        .alert-error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .alert-warning {
            background: rgba(243, 156, 18, 0.2);
            border: 1px solid #f39c12;
            color: #f39c12;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .version-badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid #667eea;
            border-radius: 15px;
            font-size: 0.85em;
            color: #667eea;
            margin-left: 10px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: background 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-header h3 {
            color: var(--primary-color);
            font-size: 1.2em;
            margin: 0;
        }

        .chart-header select {
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .chart-header select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div class="model-management-container">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-brain"></i> AI Model Management</h1>
                <p style="color: #aaa; margin-top: 10px;">Monitor and retrain machine learning models</p>
            </div>
            <a href="admin.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Admin
            </a>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- Models Overview -->
        <div class="models-grid" id="modelsGrid">
            <!-- Models will be loaded here dynamically -->
        </div>

        <!-- Analytics & Visualizations -->
        <h2 class="section-title"><i class="fas fa-chart-line"></i> Performance Analytics</h2>
        
        <div class="charts-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <!-- Performance Trends Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3><i class="fas fa-trending-up"></i> Prediction Activity (Last 30 Days)</h3>
                    <select id="trendModelSelect" onchange="updateTrendChart()">
                        <option value="screening">Screening Model</option>
                        <option value="staging">Staging Model</option>
                    </select>
                </div>
                <canvas id="activityTrendChart"></canvas>
            </div>

            <!-- Prediction Distribution Chart -->
            <div class="chart-card">
                <div class="chart-header">
                    <h3><i class="fas fa-chart-pie"></i> Prediction Distribution</h3>
                    <select id="distModelSelect" onchange="updateDistributionChart()">
                        <option value="screening">Screening Model</option>
                        <option value="staging">Staging Model</option>
                    </select>
                </div>
                <canvas id="predictionDistChart"></canvas>
            </div>
        </div>

        <!-- Performance Comparison -->
        <h2 class="section-title"><i class="fas fa-balance-scale"></i> Model Performance Comparison</h2>
        <div class="chart-card" style="margin-bottom: 40px;">
            <canvas id="modelComparisonChart" style="max-height: 400px;"></canvas>
        </div>

        <!-- Recent Predictions -->
        <h2 class="section-title"><i class="fas fa-list"></i> Recent Predictions</h2>
        <div class="predictions-table">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Model</th>
                        <th>Prediction</th>
                        <th>Probability</th>
                        <th>Case ID</th>
                        <th>Verified</th>
                    </tr>
                </thead>
                <tbody id="predictionsTableBody">
                    <!-- Predictions will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Retrain Model Modal -->
    <div id="retrainModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-sync-alt"></i> Retrain Model</h2>
                <button class="close-btn" onclick="closeRetrainModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="retrainForm" onsubmit="submitRetraining(event)">
                <input type="hidden" id="retrainModelName" name="model_name">
                
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="retrainModelDisplay" disabled>
                </div>

                <div class="form-group">
                    <label>Training Data Period (days)</label>
                    <select name="days_back" id="daysBack" required>
                        <option value="7">Last 7 days</option>
                        <option value="14">Last 14 days</option>
                        <option value="30" selected>Last 30 days</option>
                        <option value="60">Last 60 days</option>
                        <option value="90">Last 90 days</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Minimum Samples Required</label>
                    <input type="number" name="min_samples" value="50" min="10" required>
                </div>

                <div class="form-group">
                    <label>Notes (optional)</label>
                    <input type="text" name="notes" placeholder="Reason for retraining...">
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeRetrainModal()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-rocket"></i> Start Retraining
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('token');
        
        // Chart instances
        let activityTrendChart = null;
        let predictionDistChart = null;
        let modelComparisonChart = null;

        // Check authentication
        if (!authToken) {
            window.location.href = 'login.html';
        }

        // Fetch and display models
        async function loadModels() {
            try {
                const response = await fetch(`${API_BASE}/api/model-management/health`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        window.location.href = 'login.html';
                        return;
                    }
                    throw new Error('Failed to load models');
                }

                const data = await response.json();
                displayModels(data.models);
            } catch (error) {
                showAlert('Error loading models: ' + error.message, 'error');
            }
        }

        function displayModels(models) {
            const grid = document.getElementById('modelsGrid');
            grid.innerHTML = models.map(model => `
                <div class="model-card">
                    <div class="model-header">
                        <div>
                            <span class="model-title">
                                ${model.model_name.charAt(0).toUpperCase() + model.model_name.slice(1)} Model
                            </span>
                            <span class="version-badge">v${model.current_version}</span>
                        </div>
                        <span class="model-status status-${model.status === 'active' ? 'active' : model.status}">
                            ${model.status.toUpperCase()}
                        </span>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-item">
                            <div class="metric-label">Accuracy</div>
                            <div class="metric-value ${getMetricClass(model.accuracy)}">
                                ${(model.accuracy * 100).toFixed(1)}%
                            </div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">F1 Score</div>
                            <div class="metric-value ${getMetricClass(model.f1_score)}">
                                ${(model.f1_score * 100).toFixed(1)}%
                            </div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Total Predictions</div>
                            <div class="metric-value">${model.total_predictions.toLocaleString()}</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-label">Last 30 Days</div>
                            <div class="metric-value">${model.predictions_last_30d.toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="metric-item">
                        <div class="metric-label">Last Training</div>
                        <div class="metric-value" style="font-size: 1em;">
                            ${model.last_training ? new Date(model.last_training).toLocaleString() : 'Never'}
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="openRetrainModal('${model.model_name}')">
                            <i class="fas fa-sync-alt"></i> Retrain Model
                        </button>
                        <button class="btn btn-secondary" onclick="viewModelDetails('${model.model_name}')">
                            <i class="fas fa-chart-line"></i> View Details
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getMetricClass(value) {
            if (!value) return '';
            if (value >= 0.85) return 'good';
            if (value >= 0.70) return 'warning';
            return 'danger';
        }

        // Load recent predictions
        async function loadRecentPredictions() {
            try {
                const response = await fetch(`${API_BASE}/api/model-management/predictions/recent?limit=20`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load predictions');

                const data = await response.json();
                displayPredictions(data.predictions);
            } catch (error) {
                console.error('Error loading predictions:', error);
            }
        }

        function displayPredictions(predictions) {
            const tbody = document.getElementById('predictionsTableBody');
            
            if (predictions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px;">No predictions yet</td></tr>';
                return;
            }

            tbody.innerHTML = predictions.map(p => `
                <tr>
                    <td>${new Date(p.created_at).toLocaleString()}</td>
                    <td>${p.model_name}</td>
                    <td>${p.prediction || 'N/A'}</td>
                    <td>${p.prediction_proba ? (p.prediction_proba * 100).toFixed(1) + '%' : 'N/A'}</td>
                    <td>${p.case_id || 'N/A'}</td>
                    <td>
                        ${p.outcome_verified ? 
                            '<span style="color: #2ecc71;">✓ Verified</span>' : 
                            '<span style="color: #95a5a6;">Pending</span>'
                        }
                    </td>
                </tr>
            `).join('');
        }

        // Retrain Modal
        function openRetrainModal(modelName) {
            document.getElementById('retrainModelName').value = modelName;
            document.getElementById('retrainModelDisplay').value = modelName.charAt(0).toUpperCase() + modelName.slice(1) + ' Model';
            document.getElementById('retrainModal').classList.add('active');
        }

        function closeRetrainModal() {
            document.getElementById('retrainModal').classList.remove('active');
        }

        async function submitRetraining(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {
                model_name: formData.get('model_name'),
                days_back: parseInt(formData.get('days_back')),
                min_samples: parseInt(formData.get('min_samples')),
                notes: formData.get('notes') || null
            };

            try {
                const response = await fetch(`${API_BASE}/api/model-management/retrain`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Retraining failed');
                }

                showAlert(`Retraining started successfully! New version: ${result.new_version}`, 'success');
                closeRetrainModal();
                
                // Reload models after a short delay
                setTimeout(() => {
                    loadModels();
                }, 2000);

            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        function viewModelDetails(modelName) {
            // Navigate to model details page (to be implemented)
            window.location.href = `model_details.html?model=${modelName}`;
        }

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'exclamation-triangle'}"></i>
                ${message}
            `;
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // ============================================================================
        // DYNAMIC CHARTS
        // ============================================================================

        // Initialize all charts
        async function initializeCharts() {
            await createActivityTrendChart();
            await createPredictionDistributionChart();
            await createModelComparisonChart();
        }

        // Activity Trend Chart (Line chart showing predictions over time)
        async function createActivityTrendChart() {
            const modelName = document.getElementById('trendModelSelect').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/model-management/predictions/timeseries?model_name=${modelName}&days_back=30`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                // Extract labels and counts from API
                const labels = data.timeseries?.map(d => d.label) || [];
                const counts = data.timeseries?.map(d => d.count) || [];
                
                const ctx = document.getElementById('activityTrendChart').getContext('2d');
                
                if (activityTrendChart) {
                    activityTrendChart.destroy();
                }
                
                activityTrendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Predictions per Day',
                            data: counts,
                            borderColor: 'rgb(102, 126, 234)',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: true, labels: { color: '#fff' } },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                titleColor: '#fff',
                                bodyColor: '#fff'
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { color: '#aaa' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            x: {
                                ticks: { color: '#aaa', maxRotation: 45, minRotation: 45 },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating activity trend chart:', error);
            }
        }

        // Prediction Distribution Chart (Pie/Doughnut chart)
        async function createPredictionDistributionChart() {
            const modelName = document.getElementById('distModelSelect').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/model-management/predictions/stats?model_name=${modelName}&days_back=30`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                const stats = data.statistics || {};
                
                let chartData, chartLabels, chartColors;
                
                if (modelName === 'screening') {
                    const positive = stats.positive_predictions || 0;
                    const negative = stats.negative_predictions || 0;
                    
                    chartLabels = ['Positive', 'Negative'];
                    chartData = [positive, negative];
                    chartColors = ['#e74c3c', '#2ecc71'];
                } else if (modelName === 'staging') {
                    const stageDist = stats.stage_distribution || { low: 0, moderate: 0, high: 0 };
                    
                    chartLabels = ['Low Resistance', 'Moderate Resistance', 'High Resistance'];
                    chartData = [stageDist.low || 0, stageDist.moderate || 0, stageDist.high || 0];
                    chartColors = ['#2ecc71', '#f39c12', '#e74c3c'];
                }
                
                const ctx = document.getElementById('predictionDistChart').getContext('2d');
                
                if (predictionDistChart) {
                    predictionDistChart.destroy();
                }
                
                predictionDistChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            data: chartData,
                            backgroundColor: chartColors,
                            borderColor: 'rgba(0, 0, 0, 0.5)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#fff', padding: 15, font: { size: 12 } }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.parsed || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                        return `${label}: ${value} (${percentage}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating distribution chart:', error);
            }
        }

        // Model Comparison Chart (Bar chart comparing all models)
        async function createModelComparisonChart() {
            try {
                const response = await fetch(`${API_BASE}/api/model-management/health`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                const models = data.models || [];
                
                const labels = models.map(m => m.model_name.charAt(0).toUpperCase() + m.model_name.slice(1));
                const accuracy = models.map(m => (m.accuracy || 0) * 100);
                const precision = models.map(m => (m.precision || 0) * 100);
                const recall = models.map(m => (m.recall || 0) * 100);
                const f1 = models.map(m => (m.f1_score || 0) * 100);
                
                const ctx = document.getElementById('modelComparisonChart').getContext('2d');
                
                if (modelComparisonChart) {
                    modelComparisonChart.destroy();
                }
                
                modelComparisonChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Accuracy',
                                data: accuracy,
                                backgroundColor: 'rgba(102, 126, 234, 0.8)',
                                borderColor: 'rgb(102, 126, 234)',
                                borderWidth: 1
                            },
                            {
                                label: 'Precision',
                                data: precision,
                                backgroundColor: 'rgba(46, 204, 113, 0.8)',
                                borderColor: 'rgb(46, 204, 113)',
                                borderWidth: 1
                            },
                            {
                                label: 'Recall',
                                data: recall,
                                backgroundColor: 'rgba(243, 156, 18, 0.8)',
                                borderColor: 'rgb(243, 156, 18)',
                                borderWidth: 1
                            },
                            {
                                label: 'F1 Score',
                                data: f1,
                                backgroundColor: 'rgba(231, 76, 60, 0.8)',
                                borderColor: 'rgb(231, 76, 60)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: { color: '#fff', padding: 15 }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                callbacks: {
                                    label: function(context) {
                                        return `${context.dataset.label}: ${context.parsed.y.toFixed(1)}%`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                ticks: {
                                    color: '#aaa',
                                    callback: function(value) {
                                        return value + '%';
                                    }
                                },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            x: {
                                ticks: { color: '#aaa' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Error creating comparison chart:', error);
            }
        }

        // Update chart when dropdown changes
        async function updateTrendChart() {
            await createActivityTrendChart();
        }

        async function updateDistributionChart() {
            await createPredictionDistributionChart();
        }

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadModels();
            loadRecentPredictions();
            createModelComparisonChart();
            createActivityTrendChart();
            createPredictionDistributionChart();
        }, 30000);

        // Initial load
        loadModels();
        loadRecentPredictions();
        initializeCharts();
    </script>
</body>
</html>
