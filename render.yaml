services:
  - type: web
    name: hpylori-cdss
    env: python
    region: oregon
    plan: free
    branch: main
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./cdss.db
      - key: SECRET_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        value: AC23801156c2970b360ef381d558a41878
      - key: TWILIO_AUTH_TOKEN
        value: b848344f82663d21154f238307702e94
      - key: TWILIO_PHONE_NUMBER
        value: +19787834722
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: '["*"]'
    healthCheckPath: /health
    autoDeploy: true

