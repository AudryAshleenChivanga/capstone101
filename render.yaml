# Render Blueprint for H. pylori CDSS
# This file configures automatic deployment on Render.com

services:
  # Main Web Service
  - type: web
    name: h-pylori-cdss
    env: docker
    repo: https://github.com/AudryAshleenChivanga/capstone101
    branch: main
    dockerfilePath: ./Dockerfile
    region: oregon # Change to your preferred region
    plan: free # or starter/standard for production
    
    # Health check
    healthCheckPath: /health
    
    # Environment variables
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cdss-db
          property: connectionString
      
      - key: JWT_SECRET
        generateValue: true
      
      - key: JWT_EXPIRE_HOURS
        value: 24
      
      - key: SCREEN_MODEL_PATH
        value: models/screening_hp_pos_calibrated.joblib
      
      - key: STAGE_MODEL_PATH
        value: models/staging_3class.joblib
      
      - key: SCREEN_THRESH
        value: 0.60
      
      - key: ALLOWED_ORIGINS
        value: "*"
      
      - key: FRONTEND_URL
        value: https://h-pylori-cdss.onrender.com
      
      # Optional: Add your Twilio credentials as secrets
      # - key: TWILIO_ACCOUNT_SID
      #   sync: false
      
      # - key: TWILIO_AUTH_TOKEN
      #   sync: false
      
      # - key: TWILIO_PHONE_NUMBER
      #   sync: false

# Optional: PostgreSQL Database
# Uncomment this section if you want a managed PostgreSQL database
# databases:
#   - name: cdss-db
#     plan: free # or starter for production
#     databaseName: cdss
#     user: cdss_user
